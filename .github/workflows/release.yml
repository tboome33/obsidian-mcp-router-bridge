name: Release

# Build the plugin and publish a GitHub Release whenever a version tag is pushed.
# The release assets (main.js + manifest.json) are what setup-vault.mjs's
# downloadBridgePlugin() and BRAT both pull from `releases/latest/download/`.
# Tag format = the bare version (no `v` prefix), matching manifest.json + versions.json.
on:
  push:
    # Only bare-SemVer tags (e.g. 0.5.0) — matches manifest.json + the version
    # check below. Arbitrary tags (test/wip/backup) must NOT trigger a release.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build
        # `npm run build` runs tsc + esbuild, then the postbuild deploy.mjs — which
        # detects CI and skips the local .template deploy (see deploy.mjs). Emits main.js.
        run: npm run build

      - name: Verify tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$manifest_version'"
            exit 1
          fi
          echo "Tag and manifest agree on version $tag"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Published immediately — do NOT add --draft: setup-vault.mjs's
        # downloadBridgePlugin() hits releases/latest/download/ and BRAT both require a
        # PUBLISHED (non-draft, non-prerelease) release; a draft would silently freeze
        # them on the previous version. Re-tagging is unsupported: `gh release create`
        # fails if the tag's release already exists — to re-ship, bump the version
        # (npm run version) and push a NEW tag; never delete + re-push an existing tag.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes="Automated release for $tag. See CHANGELOG.md for details." \
            main.js manifest.json
