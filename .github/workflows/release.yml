name: Release

# Build the plugin and publish a GitHub Release whenever a version tag is pushed.
# The release assets (main.js + manifest.json) are what setup-vault.mjs's
# downloadBridgePlugin() and BRAT both pull from `releases/latest/download/`.
# Tag format = the bare version (no `v` prefix), matching manifest.json + versions.json.
on:
  push:
    # Only bare-SemVer tags (e.g. 0.5.0) — matches manifest.json + the version
    # check below. Arbitrary tags (test/wip/backup) must NOT trigger a release.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build
        # `npm run build` runs tsc + esbuild, then the postbuild deploy.mjs — which
        # detects CI and skips the local .template deploy (see deploy.mjs). Emits main.js.
        run: npm run build

      - name: Verify tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$manifest_version'"
            exit 1
          fi
          echo "Tag and manifest agree on version $tag"

      - name: Verify build artifacts exist
        # Cheap guard: never publish a release whose assets are missing or empty.
        run: |
          for f in main.js manifest.json; do
            if [ ! -s "$f" ]; then
              echo "::error::Build artifact '$f' is missing or empty — refusing to release"
              exit 1
            fi
            echo "$f: $(wc -c < "$f") bytes"
          done

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # IDEMPOTENT ON PURPOSE. A release for this tag may already exist — a human
        # (or an agent) often creates it by hand with a descriptive title moments
        # after `git push --tags`, racing this job. That is exactly what broke 0.9.1
        # (2026-09-04): the old single `gh release create … main.js manifest.json`
        # aborted with "a release with the same tag name already exists", the step
        # failed, and the hand-made release stayed on GitHub with assets = [] — so
        # BRAT reported "no manifest.json in the latest release" on every vault that
        # follows the plugin. 0.8.0 and 0.9.0 hit the same failure but happened to
        # have their assets attached by hand, which hid the bug for two releases.
        #
        # So: create the release only if it is absent, then ALWAYS upload the freshly
        # built assets with --clobber. Whoever won the race, CI has the last word on
        # what the binaries are — and they are always built from this tag, never
        # copied from a previous one.
        #
        # Published immediately — do NOT add --draft: setup-vault.mjs's
        # downloadBridgePlugin() hits releases/latest/download/ and BRAT both require a
        # PUBLISHED (non-draft, non-prerelease) release; a draft would silently freeze
        # them on the previous version. To re-ship, bump the version (npm run version)
        # and push a NEW tag; never delete + re-push an existing tag.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading built assets over it."
          else
            echo "Creating release $tag."
            gh release create "$tag" \
              --title="$tag" \
              --notes="Automated release for $tag. See CHANGELOG.md for details."
          fi
          gh release upload "$tag" main.js manifest.json --clobber

      - name: Verify the release carries both assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The whole point of this workflow is that BRAT finds main.js + manifest.json
        # attached to the release. Assert it instead of assuming it.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          assets=$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join(",")')
          echo "Assets on $tag: ${assets:-<none>}"
          if [ "$assets" != "main.js,manifest.json" ]; then
            echo "::error::Release $tag does not carry exactly main.js + manifest.json — BRAT would fail"
            exit 1
          fi
